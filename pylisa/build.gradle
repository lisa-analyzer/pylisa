plugins {
    id 'java'
   	id 'antlr'
   	id 'eclipse'
   	id "com.diffplug.spotless" version "6.18.0"
   	id 'maven-publish'
   	id 'java-test-fixtures'
    id 'signing'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'GitHubPackages'
        url = 'https://maven.pkg.github.com/lisa-analyzer/lisa'
        credentials {
            username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
            password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
        }
    }
}

group = 'it.unive'
version = '0.1'

def lisaVersion = '1.1-svcomp-2027-SNAPSHOT'

dependencies {
    antlr 'org.antlr:antlr4:4.8-1'


    implementation "io.github.lisa-analyzer:lisa-sdk:${lisaVersion}"
    implementation "io.github.lisa-analyzer:lisa-analyses:${lisaVersion}"
    implementation "io.github.lisa-analyzer:lisa-program:${lisaVersion}"

    implementation 'guru.nidi:graphviz-java:0.18.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'org.springframework:spring-web:6.1.6'
    implementation 'org.jdom:jdom2:2.0.5'
    implementation 'com.sun.xml.bind:jaxb-impl:3.0.2'    
    implementation 'org.thymeleaf:thymeleaf:3.0.15.RELEASE'
    implementation 'com.google.code.gson:gson:2.8.7'
    implementation 'io.github.classgraph:classgraph:4.8.175'

    implementation 'org.graphstream:gs-core:2.0'

    // the state test helper, shared with projects that test library models
    testFixturesApi "io.github.lisa-analyzer:lisa-sdk:${lisaVersion}"
    testFixturesApi "io.github.lisa-analyzer:lisa-analyses:${lisaVersion}"
    testFixturesApi "io.github.lisa-analyzer:lisa-program:${lisaVersion}"
    testFixturesApi 'org.junit.jupiter:junit-jupiter-api:5.10.3'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testImplementation 'org.assertj:assertj-core:3.26.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.apache.logging.log4j:log4j-core:2.23.1'
    testImplementation 'org.thymeleaf:thymeleaf:3.0.15.RELEASE'
}

generateGrammarSource {
    maxHeapSize = "64m"
    arguments += ["-visitor", "-no-listener"]
    
        doLast {
    	copy {
      		from 'build/generated-src/antlr/main/'
      		include '*.*'
      		into 'build/generated-src/antlr/main/it/unive/pylisa/antlr'
    	}
   		project.delete fileTree('build/generated-src/antlr/main').include('*.*')
  	}
}

java {
    withJavadocJar()
    withSourcesJar()
}


javadoc {
	if(JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
}

spotless {
    enforceCheck = false
    encoding 'UTF-8'
    lineEndings 'UNIX'
    java {
        // tabs, no spaces
        indentWithTabs()
    
        // keep imports clean 
        importOrder() 
        removeUnusedImports()
    
        // use the eclipse formatting with the one provided with the project
        eclipse().configFile(new File(rootProject.projectDir, 'spotless-formatting.xml'))
    
        target 'src/**/*.java'    
        // ignore generated code
        targetExclude '**/build/generated/**/*.java'
        targetExclude '**/build/generated-src/**/*.java'
        targetExclude '**/target/generated-sources/**/*.java'
    }
    antlr4 {
        target 'src/*/antlr/**/*.g4'
        antlr4Formatter() 
    }
}

test {
    // the tests tagged known-failing are specifications of work not done yet: knownFailingTest
    useJUnitPlatform { excludeTags 'known-failing' }
    maxHeapSize = "4g"
    // every test process writes under a directory of its own (TestDirectories); those of
    // earlier runs of this task are removed
    systemProperty 'pylisa.test.task', name
    doFirst { delete "build/analysis-results/${name}" }
    // Forward lisa.* system properties (e.g. lisa.cron.update=true) from the
    // Gradle invocation to the test JVM so tests that read them pick them up.
    systemProperties System.properties.findAll { k, v -> k.toString().startsWith("lisa.") }
}

// Runs the tests tagged known-failing, which specify behaviour not implemented yet, and fails
// as soon as one of them passes, so that its tag is removed.
tasks.register('knownFailingTest', Test) {
    group = 'verification'
    description = 'Runs the known-failing tests and fails if one of them now passes.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'known-failing' }
    maxHeapSize = "4g"
    systemProperty 'pylisa.test.task', name
    ignoreFailures = true
    doFirst { delete "build/analysis-results/${name}" }
    doLast {
        def passing = []
        def run = 0
        fileTree(reports.junitXml.outputLocation).matching { include '*.xml' }.each { file ->
            new groovy.xml.XmlSlurper().parse(file).testcase.each { testcase ->
                run++
                if (testcase.failure.size() == 0 && testcase.error.size() == 0 && testcase.skipped.size() == 0)
                    passing << "${testcase.@classname}#${testcase.@name}"
            }
        }
        if (run == 0)
            throw new GradleException("No known-failing test was run: is the tag spelt known-failing?")
        if (!passing.isEmpty())
            throw new GradleException("Known-failing tests now pass, remove their tag (for a parameterized "
                    + "test, when every invocation passes; otherwise split it): ${passing}")
    }
}

spotlessJava {
	// declaring explicit dependencies
	dependsOn 'compileJava', 'compileTestJava', 'processTestResources', 'spotlessAntlr4'
}

spotlessJavaCheck { 
    finalizedBy 'spotlessErrorMessage'
}

spotlessAntlr4Check { 
    finalizedBy 'spotlessErrorMessage'
}

task spotlessErrorMessage {
    onlyIf {
        spotlessJavaCheck.state.failure != null || spotlessAntlr4Check.state.failure != null
    }
    doLast {
        logger.error('Spotless plugin thrown an error. This means that the code is not correctly formatted.')
        logger.error('To reproduce locally, execute \'./gradlew spotlessCheck\'')
        logger.error('To automatically fix all the problems, execute \'./gradlew spotlessApply\'')
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = project.name 
            groupId = 'io.github.lisa-analyzer'
            from components.java
            pom {
                name = 'PyLiSA (' + project.name + ')' 
                description = 'Python frontend for LiSA'
                url = 'https://lisa-analyzer.github.io/'
                packaging = 'jar'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'http://www.opensource.org/licenses/mit-license.php'
                    }
                }
                developers {
                    developer {
                        id = 'lucaneg'
                        name = 'Luca Negrini'
                        email = 'luca.negrini@unive.it'
                        url = 'https://lucaneg.github.io/'
                        organization = 'Ca\' Foscari University of Venice, Italy'
                        organizationUrl = 'https://www.unive.it/'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/lisa-analyzer/pylisa.git'
                    developerConnection = 'scm:git:ssh://github.com/lisa-analyzer/pylisa.git'
                    url = 'https://github.com/lisa-analyzer/pylisa'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'OSSRH'
            url = 'https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/'
            credentials {
                username = System.getenv('MAVEN_USERNAME')
                password = System.getenv('MAVEN_PASSWORD')
            }
        }
    }
}

signing {
    def signingKey = System.getenv('SIGN_KEY')
    def signingPassword = System.getenv('SIGN_PW')
    useInMemoryPgpKeys(signingKey, signingPassword)
    sign publishing.publications.mavenJava
}

tasks.named('check') {
    dependsOn 'knownFailingTest'
}

// pylisa's command line on a Python program, from the pylisa directory:
//   ./gradlew -q pylisa --args='[--config CP|CP_BSS] [--workdir <dir>] <file.py>'
tasks.register('pylisa', JavaExec) {
    group = 'application'
    description = 'Analyses a Python program with pylisa and its generic checks.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'it.unive.pylisa.cli.PyLisaMain'
    workingDir = projectDir
    // the exit status reports findings, not a failure of the build
    ignoreExitValue = true
}
